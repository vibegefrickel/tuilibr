# The spelling check of typos-cli. The words below are names and domain terms, not typos.
[default]
# Escape sequences and git commit hashes are no words.
extend-ignore-re = ["\\\\x1b\\[[0-9;?<>]*[a-zA-Z]", "\\b[0-9a-f]{7,40}\\b"]

[default.extend-words]
herdr = "herdr"
schnattr = "schnattr"
youtr = "youtr"
phewr = "phewr"
agendr = "agendr"
tuilibr = "tuilibr"
cendre = "cendre"
ratatui = "ratatui"
moxcms = "moxcms"
turbojpeg = "turbojpeg"
libheif = "libheif"
sips = "sips"
qlmanage = "qlmanage"
flate = "flate"
flate2 = "flate2"
cll = "cll"
clli = "clli"
grammers = "grammers"

[files]
# The path data of an SVG icon is no text.
extend-exclude = ["tests/fixtures/**", "assets/icons/**", "Cargo.lock", "target/**"]
