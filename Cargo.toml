[package]
name = "tuilibr"
version = "0.1.0"
edition = "2024"
rust-version = "1.100"
# Not on crates.io: each app builds it from the git repository through a path or git dependency.
publish = false
description = "The shared terminal UI parts of schnattr, youtr, phewr, agendr and wettr: the screen frame, later the pictures"
license = "MIT"

[lib]
path = "src/lib.rs"

# The lint table is the union of the tables of the three apps. Code that passes here passes in
# each app. Each app keeps its own table for its own code.
[lints.rust]
unsafe_code = "deny"
rust_2018_idioms = { level = "warn", priority = -1 }
unused_qualifications = "warn"
unused_import_braces = "warn"
unused_lifetimes = "warn"
unused_macro_rules = "warn"
unit_bindings = "warn"
unnameable_types = "warn"
unreachable_pub = "warn"
redundant_imports = "warn"
redundant_lifetimes = "warn"
trivial_casts = "warn"
trivial_numeric_casts = "warn"
meta_variable_misuse = "warn"
macro_use_extern_crate = "warn"
missing_abi = "warn"
non_ascii_idents = "warn"
# Every public item has a doc comment (the rule of AGENTS.md), every public type a Debug.
missing_docs = "warn"
missing_debug_implementations = "warn"
ambiguous_negative_literals = "warn"
closure_returning_async_block = "warn"
impl_trait_redundant_captures = "warn"

[lints.rustdoc]
broken_intra_doc_links = "warn"
private_intra_doc_links = "allow"
unescaped_backticks = "warn"
missing_crate_level_docs = "warn"

# Cargo checks the dependencies that no target uses. It never checks `[dev-dependencies]`;
# `just audit` runs cargo-shear for those.
[lints.cargo]
unused_dependencies = "deny"

[lints.clippy]
all = { level = "warn", priority = -1 }
pedantic = { level = "warn", priority = -1 }
unwrap_used = "warn"
expect_used = "warn"
get_unwrap = "warn"
unwrap_in_result = "warn"
panic = "warn"
exit = "warn"
dbg_macro = "warn"
todo = "warn"
unimplemented = "warn"
print_stdout = "warn"
print_stderr = "warn"
mem_forget = "warn"
rest_pat_in_fully_bound_structs = "warn"
allow_attributes = "warn"
allow_attributes_without_reason = "warn"
undocumented_unsafe_blocks = "warn"
multiple_unsafe_ops_per_block = "warn"
clone_on_ref_ptr = "warn"
str_to_string = "warn"
string_slice = "warn"
string_add = "warn"
format_push_string = "warn"
infinite_loop = "warn"
iter_over_hash_type = "warn"
map_err_ignore = "warn"
unused_result_ok = "warn"
unneeded_field_pattern = "warn"
verbose_file_reads = "warn"
tests_outside_test_module = "warn"
redundant_test_prefix = "warn"
ref_patterns = "warn"
pathbuf_init_then_push = "warn"
needless_raw_strings = "warn"
renamed_function_params = "warn"
same_name_method = "warn"
error_impl_error = "warn"
mutex_atomic = "warn"
mutex_integer = "warn"
rc_mutex = "warn"
use_self = "warn"
redundant_clone = "warn"
needless_pass_by_ref_mut = "warn"
cognitive_complexity = "warn"
collection_is_never_read = "warn"
derive_partial_eq_without_eq = "warn"
equatable_if_let = "warn"
set_contains_or_insert = "warn"
significant_drop_in_scrutinee = "warn"
iter_on_single_items = "warn"
iter_on_empty_collections = "warn"
unused_peekable = "warn"
unnecessary_struct_initialization = "warn"
trait_duplication_in_bounds = "warn"
type_repetition_in_bounds = "warn"
useless_let_if_seq = "warn"
nonstandard_macro_braces = "warn"
path_buf_push_overwrite = "warn"
string_lit_as_bytes = "warn"
fallible_impl_from = "warn"
read_zero_byte_vec = "warn"
debug_assert_with_mut_call = "warn"
let_underscore_must_use = "warn"
# Restriction lints that match the rules: no panic in a fallible function, no lossy literal, one
# file layout, no needless async.
panic_in_result_fn = "warn"
assertions_on_result_states = "warn"
lossy_float_literal = "warn"
float_cmp_const = "warn"
self_named_module_files = "warn"
empty_structs_with_brackets = "warn"
unnecessary_self_imports = "warn"
pub_without_shorthand = "warn"
redundant_type_annotations = "warn"
unused_async = "warn"
# Nursery lints that the measure found useful (2026-11-19).
too_long_first_doc_paragraph = "warn"
or_fun_call = "warn"
missing_const_for_fn = "warn"

# indexing_slicing stays off: 193 index expressions in the pixel decoders, a get() in each would
# cost speed and readability (measured 2026-11-19).
# Pedantic lints that do not fit this codebase.
missing_errors_doc = "allow"
missing_panics_doc = "allow"
must_use_candidate = "allow"
similar_names = "allow"
cast_precision_loss = "allow"
large_futures = "allow"
assert_is_empty = "allow"

[dependencies]
# The frame and the terminal import these and std. crossterm: the session sets the modes of the
# terminal, and the Kitty layer reads the answers of the terminal as the key events of crossterm.
crossterm = "0.29"
# The texts of `time`: the age, the date and the time of the bar. The apps use jiff 1 with its
# default features.
jiff = "1"
ratatui = "0.30"
unicode-segmentation = "1"
unicode-width = "0.2"

# The picture module, behind the feature `pictures`. The versions are the versions of phewr.
base64 = { version = "0.23", optional = true }
fast_image_resize = { version = "6.1", optional = true }
# The gzip of a TGS sticker. `png` and `tiff` of `image` already build flate2 1.
flate2 = { version = "1", optional = true }
# Only the decoders for the formats that the apps list. AVIF goes through libheif.
image = { version = "0.25.10", default-features = false, optional = true, features = [
  "bmp",
  "exr",
  "gif",
  "hdr",
  "ico",
  "jpeg",
  "png",
  "qoi",
  "tga",
  "tiff",
  "webp",
] }
# JPEG XL in pure Rust. The default feature `rayon` decodes on the shared rayon pool. `moxcms`
# converts an ICC profile to sRGB. `image` still uses moxcms 0.8.
# Both JPEG XL pins are exact on purpose. The sample copy on all cores in `decode/jxl.rs` reads
# the rendered grids of `jxl-render` (`ImageBuffer`) and depends on their private layout in these
# versions: each grid starts at the image origin, where `ImageStream` of `jxl-oxide` starts too.
# An update is a deliberate step: change `jxl-oxide` and set `jxl-render` to the version that
# this `jxl-oxide` uses. Then run `parallel_copy_matches_stream` and the byte comparison of the
# decode on the real files.
jxl-oxide = { version = "=0.12.6", features = ["moxcms"], optional = true }
jxl-render = { version = "=0.12.4", optional = true }
kamadak-exif = { version = "0.6", optional = true }
libheif-rs = { version = "3", optional = true }
lru = { version = "0.19", optional = true }
# The ICC profile of a JPEG XL file to sRGB (`decode/jxl.rs`). `image` and `jxl-oxide` still use
# moxcms 0.8.
moxcms = { version = "0.9.2", optional = true }
rayon = { version = "1.12", optional = true }
# `poll` on the tty for the answer of the Kitty probe. crossterm uses the same version.
rustix = { version = "1", features = ["event"], optional = true }
# The ffprobe JSON of the motion module: one small pure Rust crate pair, no feature of its own.
serde = { version = "1", features = ["derive"], optional = true }
serde_json = { version = "1", optional = true }
# The temp TIFF of the `sips` route, and the temp folders of the test support.
tempfile = { version = "3.27", optional = true }
# The Lottie renderer of the TGS stickers, in pure Rust. It is not on crates.io: the pin is the
# commit of version 1.0.6, and the version field keeps cargo-deny from a wildcard error.
tlottie = { git = "https://github.com/dkaraush/tlottie", rev = "92df98dc209bc39b1e567ec74a8c86a0af5239de", version = "1.0.6", optional = true }
# Without the default feature `cmake`, turbojpeg-sys finds the Homebrew libjpeg-turbo through
# pkgconf and never builds it from source.
turbojpeg = { version = "1.5", default-features = false, features = [
  "pkg-config",
  "require-simd",
], optional = true }

[dev-dependencies]
tempfile = "3.27"

# `pictures` is on by default. An app that uses the frame only sets `default-features = false`
# and builds no decoder. The decoder features are off by default: each app turns on the ones
# that it needs.
[features]
default = ["pictures"]
# The picture module with the pure Rust decoders of `image`, the resize, the shapes, the decode
# pool with its caches, the Kitty layer and the motion module.
pictures = [
  "dep:base64",
  "dep:fast_image_resize",
  "dep:image",
  "dep:kamadak-exif",
  "dep:lru",
  "dep:moxcms",
  "dep:rayon",
  "dep:rustix",
  "dep:serde",
  "dep:serde_json",
]
# Fast JPEG decoding with DCT downscaling (libjpeg-turbo).
turbo = ["pictures", "dep:turbojpeg"]
# HEIC / HEIF and AVIF through the system libheif (>= 1.19).
heic = ["pictures", "dep:libheif-rs"]
# JPEG XL in pure Rust (jxl-oxide).
jxl = ["pictures", "dep:jxl-oxide", "dep:jxl-render"]
# The TGS stickers through the Lottie renderer `tlottie`, in pure Rust. The feature gates a git
# source: an app without stickers keeps a build from crates.io only.
lottie = ["pictures", "dep:flate2", "dep:tlottie"]
# Camera RAW, PSD, PDF, SVG and the other ImageIO formats through macOS `/usr/bin/sips`. The
# feature has no effect on other systems.
sips = ["pictures", "dep:tempfile"]
# `pictures::test_support` for the tests of an app: the fixture writers and the key events. An
# app turns it on in its dev-dependency only.
test-support = ["pictures", "dep:tempfile"]
