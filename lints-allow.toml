# The intended differences between the lint table of tuilibr and the table of each app, for
# `just lints-diff`. A key is `<group>.<lint>`, the value is the reason. A difference that is not
# listed here is drift: the recipe lists it and fails.
#
# The maintainer decided on 2026-11-20 that every app takes the table of the crate. Each app has
# it; only `unsafe_code` of schnattr differs. An entry without a difference is stale, and the
# recipe fails on it.

[all]

[app.schnattr]
"rust.unsafe_code" = "schnattr warns, because it calls libc; the crate denies"

[app.youtr]

[app.phewr]

[app.agendr]

[app.wettr]

[app.glisr]
